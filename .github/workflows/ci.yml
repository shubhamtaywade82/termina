name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Runs the workflow on any branch on request, so a branch can be checked on every platform before a pull request exists.
  workflow_dispatch:

# A newer push to the same PR cancels the older run. Pushes to main keep their own run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck-build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository agent skills
        run: pnpm skills:check

      - name: Validate agent evaluation fixtures
        run: pnpm evals:check

      - name: Check evaluation report validator syntax
        run: node --check .agents/scripts/validate-eval-report.mjs

      # The UI package typechecks against the core package's built declarations, so build first.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  # Terminal behavior differs by platform, and the pseudo-terminal path is the one most likely to break on Windows. Every platform runs the whole suite, and one failing platform does not cancel the others.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds both packages, then runs the core and UI suites with their pseudo-terminal and emulator fixtures.
      - name: Test
        run: pnpm test

  # Rehearses the publish step without uploading: a dry-run publish, then a pack of each package checked for its entry, declarations and resolved dependency ranges.
  release-rehearsal:
    name: Release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Rehearse the release
        run: pnpm release:rehearse

  # Streams a fixed 1,000-line log through the renderer and keeps the JSON report. It does not fail on speed, because shared runners vary too much for a hard threshold. Compare the artifacts across runs instead.
  render-benchmark:
    name: Render benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the render benchmark
        run: pnpm --filter @nemesis-oss/termina-core run bench -- --out "$RUNNER_TEMP/render-benchmark.json"

      - name: Keep the benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: render-benchmark
          path: ${{ runner.temp }}/render-benchmark.json
          if-no-files-found: error

  lint-ratchet:
    name: Lint ratchet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The base commit is needed to compare each changed file with its version on the base branch.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The UI files import the core package through its built declarations, so build first. Without them the type-aware rules report errors that a local run does not.
      - name: Build
        run: pnpm build

      - name: Test the ratchet
        run: node --test scripts/lint-ratchet.test.mjs

      # A changed TypeScript file may not have more xo errors than its base copy, and a file the pull request adds must have none.
      - name: Lint ratchet
        run: node scripts/lint-ratchet.mjs --base ${{ github.event.pull_request.base.sha }}

  docs:
    name: Docs site and previews
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The preview generator renders the built packages, so build them first.
      - name: Build packages
        run: pnpm build

      - name: Check committed previews are current
        run: pnpm docs:previews:check

      # Every API name the docs document must be exported by the built declarations, and every sidebar link must resolve to a page.
      - name: Check docs against the built packages
        run: pnpm docs:check

      - name: Install docs-site dependencies
        run: npm ci
        working-directory: docs-site

      - name: Build docs site
        run: npm run build
        working-directory: docs-site

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Production dependencies only. The one open high advisory (braces, via xo in devDependencies) has no patched version and does not ship in the published packages.
      - name: Audit production dependencies
        run: pnpm audit:ci

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v5
