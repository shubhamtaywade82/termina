name: Refresh pnpm lockfile for integration

on:
  push:
    branches:
      - integrate/termina-genui-input-contracts-skills

permissions:
  contents: write

concurrency:
  group: refresh-pnpm-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Regenerate lockfile using the pinned pnpm version
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile update
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches the combined workspace configuration."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh lockfile for combined GenUI/input contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
