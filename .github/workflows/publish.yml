name: Publish

# Publishes the workspace packages to npm when a semver tag is pushed, via npm
# trusted publishing (OIDC). Trusted-publisher entries on npmjs.com: workflow
# filename `publish.yml`, one per package. No npm token is stored or used. The
# job refuses to run unless every package is public and its version matches the tag.
#
# `pnpm pack` rewrites workspace: dependency ranges to concrete versions in each
# tarball, and the job fails if any packed manifest still contains one. Each
# tarball is then published with `npm publish`, which provides provenance.
# Packages publish in dependency order: core, then ui, then genui.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Pin npm for trusted publishing
        run: npm install -g npm@^11.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package versions and visibility
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Pack workspace packages
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          pnpm -r --filter './packages/*' pack --pack-destination dist
          for t in dist/*.tgz; do
            if tar -xOzf "$t" package/package.json | grep -q 'workspace:'; then
              echo "::error::workspace: range leaked into $t"
              exit 1
            fi
          done

      # Prerelease tags such as v1.0.0-beta.1 go to the `next` dist-tag, so `latest` only moves on stable releases.
      - name: Publish workspace packages (trusted publishing)
        env:
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: |
          set -euo pipefail
          for name in termina-core termina-ui termina-genui; do
            tarball="$(ls dist/nemesis-oss-${name}-*.tgz)"
            npm publish "$tarball" --access public --provenance --tag "$DIST_TAG" --ignore-scripts
          done
